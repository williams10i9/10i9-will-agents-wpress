[project]
name = "ollama-crewai-poc"
version = "0.1.0"
description = "POC local e segura de agentes CrewAI com Ollama"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[litellm]>=1.15,<2",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
local-agents = "local_agents.main:main"
agent-console = "local_agents.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agents"]
